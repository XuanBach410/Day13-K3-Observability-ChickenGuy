alerts:
  - name: high_latency_p95
    severity: critical
    condition: p95(latency_ms) > 3000ms for 5m
    type: symptom-based
    owner: Phạm Thị Phương Linh
    runbook: docs/alerts.md#alert-1-high-latency-p95
  - name: high_error_rate
    severity: warning
    condition: error_rate_pct > 2% for 5m
    type: symptom-based
    owner: Phạm Thị Phương Linh
    runbook: docs/alerts.md#alert-2-high-error-rate
  - name: quality_drop
    severity: warning
    condition: mean(quality_score) < 0.75 for 10m
    type: symptom-based
    owner: Phạm Thị Phương Linh
    runbook: docs/alerts.md#alert-3-quality-drop

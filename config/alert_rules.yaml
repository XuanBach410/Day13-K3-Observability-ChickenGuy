alerts:
  - name: latency_p95_slo_breach
    severity: critical
    metric: latency_p95_ms
    operator: gt
    threshold: 3000
    condition: latency_p95_ms > 3000 for 5m
    duration: 5m
    type: symptom-based
    owner: dashboard-slo-alert
    runbook: docs/alerts.md#latency-p95-slo-breach
  - name: error_rate_slo_breach
    severity: critical
    metric: error_rate_pct
    operator: gt
    threshold: 2
    condition: error_rate_pct > 2 for 5m
    duration: 5m
    type: symptom-based
    owner: dashboard-slo-alert
    runbook: docs/alerts.md#error-rate-slo-breach
  - name: daily_cost_slo_breach
    severity: warning
    metric: daily_cost_usd
    operator: gt
    threshold: 2.5
    condition: daily_cost_usd > 2.5 for 15m
    duration: 15m
    type: symptom-based
    owner: dashboard-slo-alert
    runbook: docs/alerts.md#daily-cost-slo-breach
  - name: quality_score_slo_breach
    severity: warning
    metric: quality_score_avg
    operator: lt
    threshold: 0.75
    condition: quality_score_avg < 0.75 for 10m
    duration: 10m
    type: symptom-based
    owner: dashboard-slo-alert
    runbook: docs/alerts.md#quality-score-slo-breach

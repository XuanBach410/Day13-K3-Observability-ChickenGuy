<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 13: AI Observability UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-danger: #ef4444;
            --accent-success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(239, 68, 68, 0.1) 0%, transparent 50%);
            padding: 2rem;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex-grow: 1;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            color: #e2e8f0;
        }

        /* Chat UI */
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-right: 0.5rem;
        }

        .message {
            max-width: 85%;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent-primary), #6366f1);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #6ee7b7;
            margin-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 0.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }
        
        .message-meta.error {
            color: #fca5a5;
        }

        .chat-input-area {
            display: flex;
            gap: 1rem;
        }

        input[type="text"], select {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
        
        .chat-input-area input {
            flex-grow: 1;
        }

        button {
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Control Panel */
        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .control-item.active {
            border-color: var(--accent-danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .control-item-label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .control-item-label strong {
            font-size: 0.95rem;
        }

        .control-item-label span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.1);
            transition: .3s;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-danger);
            border-color: var(--accent-danger);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Settings grid */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .setting-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        
        .setting-field label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <header>
        <h1>ChickenGuy AI Observer</h1>
    </header>

    <div class="container">
        <!-- Chat Interface -->
        <div class="glass-panel">
            <h2>Giao tiếp với AI</h2>
            
            <div class="settings-grid">
                <div style="display: flex; gap: 1rem;">
                    <div class="setting-field" style="flex: 1;">
                        <label>User ID</label>
                        <input type="text" id="userId" value="user_123" placeholder="user_123">
                    </div>
                    <div class="setting-field" style="flex: 1;">
                        <label>Session ID</label>
                        <input type="text" id="sessionId" value="session_abc" placeholder="session_abc">
                    </div>
                    <div class="setting-field" style="flex: 1;">
                        <label>Feature</label>
                        <select id="feature">
                            <option value="qa">QA Chung</option>
                            <option value="refund">Hoàn Tiền (refund)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message ai">
                    Chào bạn! Mình là AI Assistant. Bạn cần hỏi về chính sách hay hoàn tiền (refund)?
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Nhập câu hỏi (VD: policy for refund)..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button id="sendBtn" onclick="sendMessage()">Gửi</button>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="glass-panel">
            <h2>Hệ Sinh Thái Sự Cố (Incidents)</h2>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                Bật tắt các sự cố để kiểm tra khả năng Observability (ghi log, đo latency, cost).
            </p>
            
            <div class="control-group" id="incidentControls">
                <!-- Populated by JS -->
            </div>
            
            <div style="margin-top: auto;">
                <h2 style="font-size: 1rem; border:none; padding:0; margin-bottom:0.5rem;">Trạng Thái Hệ Thống</h2>
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
                    <div style="display:flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color:var(--text-muted)">API Status:</span>
                        <span id="apiStatus" style="color:var(--accent-success)">Online</span>
                    </div>
                    <div style="display:flex; justify-content: space-between;">
                        <span style="color:var(--text-muted)">Tracing:</span>
                        <span id="tracingStatus" style="color:var(--accent-primary)">Enabled</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check health & incidents on load
        async function fetchHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                document.getElementById('apiStatus').textContent = data.ok ? 'Online' : 'Offline';
                document.getElementById('apiStatus').style.color = data.ok ? 'var(--accent-success)' : 'var(--accent-danger)';
                document.getElementById('tracingStatus').textContent = data.tracing_enabled ? 'Enabled' : 'Disabled';
                
                renderIncidents(data.incidents);
            } catch (err) {
                document.getElementById('apiStatus').textContent = 'Offline';
                document.getElementById('apiStatus').style.color = 'var(--accent-danger)';
                console.error("Health check failed", err);
            }
        }

        const incidentDescriptions = {
            "rag_slow": "Gây nghẽn RAG (delay 2.5s) khi truy vấn",
            "cost_spike": "Nhân 4 lần số tokens (tốn chi phí)",
            "tool_fail": "Làm crash hệ thống (lỗi 500)"
        };

        function renderIncidents(incidents) {
            const container = document.getElementById('incidentControls');
            container.innerHTML = '';
            
            for (const [name, active] of Object.entries(incidents)) {
                const desc = incidentDescriptions[name] || "Sự cố hệ thống";
                const div = document.createElement('div');
                div.className = `control-item ${active ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="control-item-label">
                        <strong>${name}</strong>
                        <span>${desc}</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" onchange="toggleIncident('${name}', this.checked)" ${active ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                `;
                container.appendChild(div);
            }
        }

        async function toggleIncident(name, isEnable) {
            const action = isEnable ? 'enable' : 'disable';
            try {
                const res = await fetch(`/incidents/${name}/${action}`, { method: 'POST' });
                const data = await res.json();
                renderIncidents(data.incidents);
            } catch (err) {
                console.error(`Failed to ${action} ${name}`, err);
                fetchHealth(); // Revert UI
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();
            if (!message) return;

            // Gather settings
            const userId = document.getElementById('userId').value || 'user_123';
            const sessionId = document.getElementById('sessionId').value || 'session_abc';
            const feature = document.getElementById('feature').value || 'qa';

            // Add user message to UI
            addMessageToUI(message, 'user');
            input.value = '';
            
            // Disable UI while waiting
            input.disabled = true;
            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div>';

            const payload = {
                user_id: userId,
                session_id: sessionId,
                feature: feature,
                message: message
            };

            const startTime = Date.now();
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                const actualLatency = Date.now() - startTime;
                
                if (res.ok) {
                    addMessageToUI(data.answer, 'ai', {
                        latency: data.latency_ms,
                        tokens: data.tokens_in + data.tokens_out,
                        cost: data.cost_usd,
                        correlation_id: data.correlation_id
                    });
                } else {
                    addMessageToUI(`Error: ${data.detail}`, 'ai', {
                        latency: actualLatency,
                        error: true,
                        correlation_id: res.headers.get('x-request-id') || 'unknown'
                    });
                }
            } catch (err) {
                addMessageToUI(`Network Error: ${err.message}`, 'ai', { error: true });
            } finally {
                input.disabled = false;
                btn.disabled = false;
                btn.textContent = 'Gửi';
                input.focus();
            }
        }

        function addMessageToUI(text, type, meta = null) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            
            if (meta) {
                const metaDiv = document.createElement('div');
                metaDiv.className = `message-meta ${meta.error ? 'error' : ''}`;
                
                if (meta.error) {
                    metaDiv.innerHTML = `
                        <span>Latency: ${meta.latency}ms</span>
                        <span style="text-align: right;">ReqID: ${meta.correlation_id}</span>
                    `;
                } else {
                    metaDiv.innerHTML = `
                        <span>⏳ Latency: ${meta.latency}ms</span>
                        <span style="text-align: right;">🎟️ Tokens: ${meta.tokens}</span>
                        <span>💰 Cost: $${meta.cost.toFixed(6)}</span>
                        <span style="text-align: right;">ReqID: ${meta.correlation_id}</span>
                    `;
                }
                msgDiv.appendChild(metaDiv);
            }
            
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Init
        fetchHealth();
    </script>
</body>
</html>
